# ============================================================
# Numerical / artificial parameters
# These values are intentionally separated from physical case data.
# Format: Key value
# ============================================================

# Implicit viscosity solver
ViscosityMaxIteration 1000000
ViscosityTolerance 1.0e-8
ViscosityAbsoluteTolerance 1.0e-12

# PPE solver
PpeMaxIteration 500
PpeTolerance 1.0e-7

# Free-surface detection
PpeSurfLambdaMin 0.75
PpeSurfLambdaKeep 0.55
PpeSurfPndMin 0.85
PpeSurfProbeRatio 1.0

# ISPH internal stabilization
IsphEcsAlpha 2.5e-3
IsphDensityErrMax 1.0e-2
IsphMinPairRatio 0.35
IsphQmlsReg 1.0e-10
IsphPressureFloor 0

# Two-phase projection / stabilization
TwoPhaseDensityRelaxTime 0.01
TwoPhaseMaxSpeed 0.0
TwoPhaseDtMinRatio 1.0e-4
TwoPhaseOpenSurface 0
TwoPhaseSourceGamma 0.0
TwoPhaseRhoSmooth 0.0
TwoPhaseShiftCoef 0.10
TwoPhaseIfThreshold 0.02
TwoPhaseIfShiftNormal 0.0
TwoPhaseShiftVelCorr 1.0
TwoPhaseDuCap 0.10
TwoPhaseMinFluidNb 4
PpePureNeumann 0

# Surface-tension numerical model
TwoPhaseStModel 0
TwoPhaseStSmoothRatio 1.0
TwoPhaseStDoubleSmooth 1
TwoPhaseStDensityScale 1.0
TwoPhaseStZeroNet 0.0
TwoPhaseStDeltaMin 0.05
TwoPhaseCurvMax 2.0
TwoPhasePpRadiusRatio 3.1

# Wall numerical treatment
WallNoSlip 1
WallHardNonPenetration 1
WallViscMorris 0
WallViscTangential 0
WallMinGapRatio 0.75
WallImpactBufferRatio 0.10
WallImpactCfl 0.50
WallPressureFullRatio 1.05
WallPressureRangeRatio 1.75
WallViscFullRatio 1.10
WallViscRangeRatio 1.80

# Legacy WBP numerical controls
WbpActivationRatio 0.06
WbpWeightRatio 0.50
WbpBcRelax 0.85
WbpAccelCapFactor 30.0
WbpDistanceMinRatio 0.50
WbpDistanceMaxRatio 1.50
